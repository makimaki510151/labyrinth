<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルな2D迷路</title>
    <style>
        html,
        body {
            background: #fff;
        }
        #unity-bootstrap {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(245, 248, 252, 0.95);
            font-family: system-ui, sans-serif;
            font-weight: 600;
            color: #1a237e;
        }
        #unity-loading-bar {
            width: min(320px, 86vw);
            height: 12px;
            border: 2px solid rgba(63, 81, 181, 0.45);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            overflow: hidden;
        }
        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #5c6bc0, #3949ab);
            transition: width 0.12s ease-out;
        }
        #unity-canvas {
            position: fixed;
            width: 1px;
            height: 1px;
            left: 0;
            top: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" width="1" height="1" aria-hidden="true"></canvas>
    <div id="unity-bootstrap">
        <span>読み込み中…</span>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
    <div id="labyrinth-root">
    <div id="labyrinth-design-frame">
    <div id="labyrinth-design-surface">
    <div id="title-screen" class="screen active">
        <div class="title-container">
            <h1>シンプルな2D迷路</h1>
            <button id="start-button" class="menu-button">ステージ迷路に挑戦</button>
            <button id="random-maze-button" class="menu-button">ランダム迷路に挑戦</button>
        </div>
    </div>

    <div id="random-select-screen" class="screen">
        <div class="level-select-container">
            <h2>難易度を選択</h2>
            <p id="random-select-hint" class="random-select-hint"></p>
            <div id="random-difficulty-grid" class="level-grid"></div>
            <button id="back-from-random-select" class="menu-button">タイトルに戻る</button>
        </div>
    </div>

    <div id="level-select-screen" class="screen">
        <div class="level-select-container">
            <h2>迷路を選択</h2>
            <div id="level-grid" class="level-grid">
                </div>
            <button id="back-to-title" class="menu-button">タイトルに戻る</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-container">
            <div class="game-header">
                <button id="back-to-select" class="menu-button small">戻る</button>
                <span id="current-level">レベル 1</span>
            </div>
            
            <div class="game-main">
                <div class="maze-container">
                    <canvas id="maze-canvas" width="400" height="400"></canvas>
                </div>
                
                <div class="game-sidebar">
                    <div class="controls controls--dpad-align-start" id="mobile-controls">
                        <div class="direction-pad" role="group" aria-label="移動（テンキー2468相当の十字）">
                            <button type="button" class="direction-pad-btn" id="dpad-up" data-dx="0" data-dy="-1" aria-label="上">↑</button>
                            <button type="button" class="direction-pad-btn" id="dpad-left" data-dx="-1" data-dy="0" aria-label="左">←</button>
                            <button type="button" class="direction-pad-btn" id="dpad-right" data-dx="1" data-dy="0" aria-label="右">→</button>
                            <button type="button" class="direction-pad-btn" id="dpad-down" data-dx="0" data-dy="1" aria-label="下">↓</button>
                        </div>
                        <button type="button" id="dpad-align-toggle" class="dpad-align-toggle" aria-pressed="false" aria-label="矢印を画面の右寄せに切り替え（利き手に合わせて親指で押しやすい位置へ）" title="矢印を画面右寄せへ">⇄</button>
                    </div>
                    
                    <div class="volume-control">
                        <label for="volume-slider">音量調節</label>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.6">
                    </div>
                    
                    <div class="minimap-container">
                        <h3>ミニマップ</h3>
                        <canvas id="minimap-canvas" width="180" height="180"></canvas>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <div id="clear-screen" class="screen">
        <div class="clear-container">
            <h2>クリア！</h2>
            <p id="clear-message">おめでとうございます！</p>
            <p id="ranking-send-status" class="ranking-send-status" hidden></p>
            <button id="next-level-btn" class="menu-button">次のレベル</button>
            <button id="replay-random-btn" class="menu-button" style="display:none">もう一度</button>
            <button id="back-to-select-clear" class="menu-button">レベル選択に戻る</button>
        </div>
    </div>
    </div>
    </div>
    </div>

    <script src="Build/labyrinth.loader.js"></script>
    <script>
        var unityCanvas = document.getElementById("unity-canvas");
        var bootstrap = document.getElementById("unity-bootstrap");
        var progressBarFull = document.getElementById("unity-progress-bar-full");
        var config = {
            dataUrl: "Build/labyrinth.data.gz",
            frameworkUrl: "Build/labyrinth.framework.js.gz",
            codeUrl: "Build/labyrinth.wasm.gz",
            companyName: "nec",
            productName: "labyrinth",
            productVersion: "1.0.0"
        };
        createUnityInstance(unityCanvas, config, function (progress) {
            if (progressBarFull) {
                progressBarFull.style.width = (100 * progress) + "%";
            }
        })
            .then(function (instance) {
                window.unityInstance = instance;
                if (bootstrap) {
                    bootstrap.style.display = "none";
                }
            })
            .catch(function (message) {
                alert(message);
            });
    </script>
</body>
</html>
